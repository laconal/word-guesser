[package]
name = "allias"
version = "0.1.0"
description = "Word-explaining party game"
edition = "2021"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "allias_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source, so it works the same on desktop and Android.
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rust_xlsxwriter = "0.104.0"
calamine = "0.38.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
